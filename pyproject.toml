[project]
name = "ai-drum-practice-coach-poc"
version = "0.1.0"
description = "PoC for the AI Drum Practice Coach audio analysis pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "demucs==4.1.0",
    "julius>=0.2.3",
    "numpy",
    "pyyaml",
    "soundfile",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
# The PoC targets Apple Silicon Macs only. Without this, the universal lock follows
# demucs' Intel-Mac constraint (torch<2.3) for every platform.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
poc = "poc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the real Demucs model"]
addopts = "-m 'not slow'"
